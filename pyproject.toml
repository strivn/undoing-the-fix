[project]
name = "control-hackathon-2026"
version = "0.1.0"
description = "CVE Regression as AI Control Setting — Apart Research Hackathon 2026"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "datasets",
    "requests",
    "beautifulsoup4",
    "matplotlib",
    "scikit-learn",
    "ipykernel>=7.2.0",
    "jupyter>=1.1.1",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
